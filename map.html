<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="AVATOUR - Mappa interattiva dei punti di interesse">
    <meta name="theme-color" content="#1e40af">
    <title>AVATOUR - Mappa POI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="map-page view-map">
    <!-- Header -->
    <header class="map-header">
        <div class="header-left">
            <button id="back-btn" class="btn-icon" title="Indietro">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
        </div>

        <div class="header-center">
            <h1 class="map-title">
                <img id="client-logo" class="client-logo-header" src="" alt="" style="display:none;">
                <svg id="map-default-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="map-icon">
                    <path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z"/>
                    <path d="M8 2v16M16 6v16"/>
                </svg>
                <span id="map-title-text">POI nelle vicinanze</span>
            </h1>
        </div>

        <div class="header-right" style="display:flex;align-items:center;gap:8px;">
            <!-- Locate Button -->
            <button id="locate-btn" class="locate-btn btn-icon" title="La mia posizione">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                    <line x1="12" y1="2" x2="12" y2="6"/>
                    <line x1="12" y1="18" x2="12" y2="22"/>
                    <line x1="2" y1="12" x2="6" y2="12"/>
                    <line x1="18" y1="12" x2="22" y2="12"/>
                </svg>
            </button>
            <!-- Language Selector: inline flags, no dropdown -->
            <div class="lang-inline" id="lang-inline">
                <button class="lang-flag-btn active" data-lang="it" title="Italiano">
                    <span class="fi fi-it"></span>
                </button>
                <button class="lang-flag-btn" data-lang="en" title="English">
                    <span class="fi fi-gb"></span>
                </button>
                <button class="lang-flag-btn" data-lang="de" title="Deutsch">
                    <span class="fi fi-de"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- View Tabs -->
    <div class="view-tabs">
        <button class="tab-btn active" id="tab-map">🗺 Mappa</button>
        <button class="tab-btn" id="tab-list">📍 Punti di interesse</button>
    </div>

    <!-- Map Container -->
    <div id="map" class="map-container"></div>

    <!-- POI List Panel -->
    <div class="poi-list-panel">
        <div class="panel-header">
            <h2>Punti di interesse</h2>
        </div>
        <div id="poi-list" class="poi-list">
            <!-- POI cards will be inserted here by JavaScript -->
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="map-loading" class="map-loading">
        <div class="spinner"></div>
        <p>Caricamento mappa...</p>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <script src="assets/js/map.js"></script>
</body>
</html>
